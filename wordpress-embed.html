<!-- Paste everything below into a WordPress "Custom HTML" block on the members-only page.
     The frame resizes itself to fit the board. If WordPress strips the <script> part,
     the frame stays at the fixed height below and scrolls inside instead. -->

<iframe id="nha-leaderboard"
        src="https://connordnelson99-hash.github.io/baaja-advocacy-challenge/"
        title="BAAJA Advocacy Challenge"
        style="width:100%;height:2700px;border:0;display:block"
        loading="lazy"></iframe>
<script>
window.addEventListener("message", function (e) {
  if (e.origin !== "https://connordnelson99-hash.github.io") return;
  if (!e.data || e.data.type !== "nha-leaderboard-height") return;
  var frame = document.getElementById("nha-leaderboard");
  if (frame && e.data.height > 200) frame.style.height = e.data.height + "px";
});
</script>

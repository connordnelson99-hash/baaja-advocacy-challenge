name: Refresh leaderboard

on:
  schedule:
    # Hourly, at 7 past to avoid the top-of-hour rush that delays scheduled runs.
    - cron: '7 * * * *'
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # so the job can commit the refreshed JSON back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOTERVOICE_API_KEY: ${{ secrets.VOTERVOICE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull from VoterVoice and build docs/leaderboard.json
        # Standard library only, so there is nothing to install. The script
        # prints counts only: this repository and its run logs are public.
        run: python scripts/refresh.py

      - name: Commit the data file if it changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/leaderboard.json
          # Ignore a change that is only the "updated" timestamp.
          if git diff --cached --quiet -I '"updated"'; then
            echo "No changes to commit."
            git reset -q
          else
            git commit -m "Refresh: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
